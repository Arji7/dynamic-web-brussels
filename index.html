<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brussels Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1>Brussels Explorer</h1>
    <div class="controls">
      <!-- Zoekveld voor locaties filteren op naam -->
      <input type="text" placeholder="Zoek..." id="search" />
      <select id="filter">
        <option value="">Filter op type</option>
      </select>
      <!-- Soorteren  op naam of gemeente-->
      <select id="sort">
        <option value="">Sorteren</option>
        <option value="naam">Naam A-Z</option>
        <option value="gemeente">Gemeente A-Z</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Naam</th>
          <th>Type</th>
          <th>Gemeente</th>
          <th>Adres</th>
          <th>Categorie</th>
          <th>Website</th>
          <th>Favoriet</th>
        </tr>
      </thead>
      <!-- Tabel waar de API data in geladen wordt -->
      <tbody id="table-body"></tbody>
    </table>

    <!-- Formulier voor locatie suggesties -->
    <div class="form-section">
      <h2>Suggereer een locatie</h2>
      <form id="suggestion-form">
        <label for="name">Naam:</label>
        <input type="text" id="name" />
        <span class="error" id="name-error"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" />
        <span class="error" id="email-error"></span>

        <label for="suggestion">Jouw suggestie:</label>
        <textarea id="suggestion" rows="3"></textarea>
        <span class="error" id="suggestion-error"></span>

        <button type="submit">Versturen</button>
      </form>

      <div id="suggestions-list"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
